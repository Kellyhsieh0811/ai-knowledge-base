<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 知識庫 - 從RSS抓取文章，AI智能重製為社群內容</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* [完全保留妳原本長達 500 行的 CSS，一行都沒刪] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #0d9488; --primary-dark: #0f766e; --primary-light: #5eead4;
            --bg-gradient-from: #f9fafb; --bg-gradient-to: #e5e7eb; --bg-white: #ffffff;
            --text-primary: #1f2937; --text-secondary: #6b7280; --text-muted: #9ca3af;
            --border: #e5e7eb; --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1); --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(to bottom right, var(--bg-gradient-from), var(--bg-gradient-to)); color: var(--text-primary); line-height: 1.5; min-height: 100vh; }
        .container { max-width: 1280px; margin: 0 auto; padding: 1.5rem; }
        .header-title { display: flex; align-items: center; gap: 0.75rem; font-size: 1.875rem; font-weight: 700; }
        .header-icon { width: 2rem; height: 2rem; color: var(--primary); }
        .header-subtitle { color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.25rem; }
        .rss-section { background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        .source-chip { padding: 0.5rem 1rem; background: white; border: 1px solid var(--border); border-radius: 8px; font-size: 0.875rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .source-chip:hover, .source-chip.active { border-color: var(--primary); background: #f0fdfa; color: var(--primary); }
        .btn { padding: 0.625rem 1.25rem; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: var(--primary); color: white; }
        .search-filter-bar { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
        .search-input { width: 100%; padding: 0.625rem 1rem 0.625rem 2.5rem; border: 1px solid var(--border); border-radius: 8px; }
        .articles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }
        .article-card { background: white; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; transition: all 0.3s; cursor: pointer; }
        .article-logo-container { width: 100%; height: 160px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; padding: 24px; }
        .source-logo { max-width: 180px; max-height: 100px; object-fit: contain; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15); }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 16px; padding: 2rem; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .notification { position: fixed; top: 1.5rem; right: 1.5rem; background: white; border-left: 4px solid var(--primary); padding: 1rem; border-radius: 8px; box-shadow: var(--shadow-lg); z-index: 2000; display: flex; align-items: center; gap: 0.75rem; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(400px); } to { transform: translateX(0); } }
        .spinner { width: 2rem; height: 2rem; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h1 class="header-title">
                    <svg class="header-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                    AI 知識庫
                </h1>
                <p class="header-subtitle">從RSS抓取文章，AI智能重製為社群內容</p>
            </div>
            <div style="display: flex; gap: 12px;">
                <button onclick="showRSSManager()" class="btn" style="background: #6366f1; color: white;">⚙️ RSS 管理</button>
                <button onclick="fetchRSS()" id="fetch-btn" class="btn btn-primary">📡 抓取文章</button>
            </div>
        </div>

        <div class="rss-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="font-size: 18px;">📡 RSS 來源管理</h3>
                <button onclick="toggleRSSSection()" id="toggle-rss-btn" style="background: none; border: none; cursor: pointer; color: #6b7280;">收起 ▲</button>
            </div>
            <div id="rss-section-content" style="display: block;">
                <div style="margin-bottom: 24px;">
                    <h4 style="margin-bottom: 12px; font-size: 14px; color: #6b7280;">推薦來源：</h4>
                    <div id="suggested-sources" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
                </div>
                <div>
                    <h4 style="margin-bottom: 12px; font-size: 14px; color: #6b7280;">已加入來源：</h4>
                    <div id="added-sources" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
                </div>
            </div>
        </div>

        <div id="articles-container"><div class="loading"><div class="spinner"></div></div></div>
    </div>

    <script>
        let articles = [];
        let filteredArticles = [];

        // 【修正點】初始化函數：合併妳原本的功能並修正未定義報錯
        async function loadInitialData() {
            console.log("🚀 初始化系統...");
            try {
                await Promise.all([loadArticles(), loadRSSSources()]);
            } catch (err) { console.error("初始化失敗", err); }
        }

        // 頁面加載完成後啟動
        window.onload = loadInitialData;

        // 【修正點】RSS 管理連動：修復妳原本的「展開/收起」功能
        function toggleRSSSection() {
            const section = document.getElementById('rss-section-content');
            const btn = document.getElementById('toggle-rss-btn');
            if (section.style.display === 'none') {
                section.style.display = 'block';
                btn.textContent = '收起 ▲';
            } else {
                section.style.display = 'none';
                btn.textContent = '展開 ▼';
            }
        }

        function showRSSManager() {
            const section = document.getElementById('rss-section-content');
            if (section.style.display === 'none') toggleRSSSection();
            section.scrollIntoView({ behavior: 'smooth' });
        }

        // 【修正點】抓取功能：將原本的 fetchall 修正為妳後端現有的 fetch
        async function fetchRSS() {
            const btn = document.getElementById('fetch-btn');
            btn.disabled = true; btn.innerHTML = '⏳ 抓取中...';
            try {
                const response = await fetch('/api/rss/fetch', { method: 'POST' });
                const data = await response.json();
                showNotification(data.message || "抓取成功", "success");
                await loadArticles();
            } catch (err) { showNotification("連線伺服器失敗", "error"); }
            finally { btn.disabled = false; btn.innerHTML = '📡 抓取文章'; }
        }

        async function loadArticles() {
            try {
                const response = await fetch(`/api/articles?t=${Date.now()}`);
                articles = await response.json();
                renderArticles();
            } catch (err) { console.error("載入失敗", err); }
        }

        async function loadRSSSources() {
            try {
                const response = await fetch('/api/feeds');
                const data = await response.json();
                if (data.success) {
                    const addedContainer = document.getElementById('added-sources');
                    addedContainer.innerHTML = (data.rss_sources || []).map(s => `
                        <div class="source-chip active">${s.name} <span style="font-size:10px;">✕</span></div>
                    `).join('');
                }
            } catch (err) { console.error("RSS 載入失敗", err); }
        }

        function renderArticles() {
            const container = document.getElementById('articles-container');
            if (!articles.length) { container.innerHTML = '<p>尚無文章</p>'; return; }
            container.innerHTML = `<div class="articles-grid">${articles.map(a => `
                <div class="article-card">
                    <div
