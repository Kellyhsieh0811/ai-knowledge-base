<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 知識庫 - 從RSS抓取文章</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* [保留妳原本強大的 CSS] */
        :root { --primary: #0d9488; --text-primary: #1f2937; --border: #e5e7eb; }
        body { font-family: 'Inter', sans-serif; background: #f9fafb; color: var(--text-primary); margin: 0; }
        .container { max-width: 1280px; margin: 0 auto; padding: 1.5rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .btn { padding: 0.6rem 1.2rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
        .btn-primary { background: var(--primary); color: white; }
        .articles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
        .article-card { background: white; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
        .article-content { padding: 1.25rem; }
        .spinner { width: 2rem; height: 2rem; border: 3px solid #eee; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div>
                <h1>AI 知識庫</h1>
                <p>從RSS抓取文章，AI智能重製為社群內容</p>
            </div>
            <div>
                <button onclick="fetchRSS()" id="fetch-btn" class="btn btn-primary">📡 抓取文章</button>
            </div>
        </header>

        <div id="articles-container">
            <div style="display:flex; justify-content:center; padding: 50px;">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script>
        let articles = [];

        // 核心載入函數
        async function loadInitialData() {
            console.log("🚀 執行初始化...");
            await loadArticles();
        }

        async function loadArticles() {
            try {
                const response = await fetch(`/api/articles?t=${Date.now()}`);
                articles = await response.json();
                renderArticles();
            } catch (err) {
                console.error("載入失敗:", err);
            }
        }

        async function fetchRSS() {
            const btn = document.getElementById('fetch-btn');
            btn.disabled = true;
            btn.innerText = '⏳ 抓取中...';
            try {
                const response = await fetch('/api/rss/fetch', { method: 'POST' });
                const data = await response.json();
                alert(data.message || "抓取成功");
                await loadArticles();
            } catch (err) {
                alert("抓取失敗");
            } finally {
                btn.disabled = false;
                btn.innerText = '📡 抓取文章';
            }
        }

        function renderArticles() {
            const container = document.getElementById('articles-container');
            if (!articles || articles.length === 0) {
                container.innerHTML = '<p>目前沒有文章，請點擊抓取。</p>';
                return;
            }
            container.innerHTML = `
                <div class="articles-grid">
                    ${articles.map(a => `
                        <div class="article-card">
                            <div class="article-content">
                                <h3>${a.title}</h3>
                                <p style="font-size: 0.9rem; color: #666;">${a.summary}</p>
                                <a href="${a.url}" target="_blank">查看原文</a>
                            </div>
                        </div>
                    `).join('')}
                </div>`;
        }

        // 初始化
        window.onload = loadInitialData;
    </script>
</body>
</html>
